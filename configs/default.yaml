# Default configuration for the CGPM starter.
# Everything here is overridable from the command line, for example:
#   python -m src.evaluate --config configs/default.yaml --set slm.model_name=Qwen/Qwen2.5-0.5B-Instruct

seed: 13

data:
  # Which corpus to run. Three loaders are implemented in src/data.py:
  #   synthetic  deterministic generator, no downloads, exact needs_memory label
  #   jsonl      your own converted benchmark, schema documented in load_jsonl
  #   hf         any HuggingFace dataset, via the field mapping below
  # Start with "synthetic" so you can get the whole loop running in one evening.
  dataset: synthetic

  # Used when dataset == "jsonl".
  jsonl_path: data/converted/locomo.jsonl

  # Used when dataset == "hf". Set these to whichever benchmark you convert
  # first, and verify the column names before trusting the numbers.
  hf_repo: null
  hf_name: null
  hf_split: train
  hf_fields:
    user_id: user_id
    question: input
    answer: output
    memories: profile
    memory_text: text

  num_users: 40              # synthetic only
  turns_per_user: 60         # synthetic only
  queries_per_user: 25       # synthetic only
  # Fraction of queries that genuinely require the personal memory store.
  # This is the ground-truth signal the confidence gate has to learn.
  memory_needed_rate: 0.5
  split_ratios: [0.6, 0.2, 0.2]   # train / val / test over users
  cache_dir: .cache

memory:
  # Sentence encoder used for both the memory index and the query embedding.
  encoder_name: sentence-transformers/all-MiniLM-L6-v2
  embed_batch_size: 64
  top_k: 4
  # Number of centroids in the offline memory sketch (per user).
  sketch_clusters: 8
  normalize: true

slm:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  # Swap up when your GPU allows it:
  #   Qwen/Qwen2.5-1.5B-Instruct, meta-llama/Llama-3.2-1B-Instruct,
  #   HuggingFaceTB/SmolLM2-1.7B-Instruct, microsoft/Phi-3.5-mini-instruct
  max_new_tokens: 64
  temperature: 0.0
  dtype: auto
  device: auto
  # The prefix probe reads the model's own uncertainty from a very short
  # forward pass, before any retrieval happens.
  probe_max_new_tokens: 8

gate:
  hidden_dim: 128
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  batch_size: 64
  # Router thresholds, tuned on the validation split by scripts/train_gate.sh.
  tau_low: 0.35
  tau_high: 0.85
  # Set to true to fit a per-user temperature on the validation split.
  per_user_calibration: true

routing:
  # Which policy the evaluation harness should run.
  # never | always | verbalized | gate | oracle
  policy: gate
  # "oracle" uses the ground-truth memory-needed label. It is the ceiling,
  # not a baseline you can submit.

eval:
  batch_size: 8
  report_dir: experiments/runs
  save_predictions: true
